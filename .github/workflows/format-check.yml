on:
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dev shell pins go and golangci-lint, so `make fmt` runs the same
      # versions here as it does locally.
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - run: nix develop --command make fmt
      - name: Fail if formatting changes are needed.
        run: git diff --exit-code
